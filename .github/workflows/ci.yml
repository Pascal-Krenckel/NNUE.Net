name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 (AVX2 / AVX-512, depending on the runner), ARM64 Linux (NEON), Windows, ARM64 macOS (NEON with dot product)
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8, 10 and 11 (the .NET 11 SDK adds the net11.0 target, the runtimes 8 and 10 run the other targets)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore Nnue.sln

      - name: Build
        run: dotnet build Nnue.sln -c Release --no-restore

      - name: Show the SIMD backends of this runner
        run: dotnet run -c Release --no-build --project Nnue.Demo

      - name: Test
        run: dotnet test Nnue.Tests/Nnue.Tests.csproj -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
