name: Publish NuGet package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version, e.g. 0.2.0 or 0.2.0-beta.1
        required: true
        type: string

# Trusted publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing): no long-lived API key is stored in GitHub.
# The job proves its identity to nuget.org with a GitHub OIDC token and receives a temporary API key (valid for one hour).
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # lets GitHub issue the OIDC token that NuGet/login exchanges for a temporary API key
    # Must match the "Environment" field of the trusted publishing policy on nuget.org. Add required reviewers to the environment
    # (Settings -> Environments -> nuget) to approve every release by hand.
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (the .NET 11 SDK builds the net11.0 target with AVX512-VNNI)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Determine the version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then version="${GITHUB_REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid package version (expected e.g. 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing Nnue.Net $version"

      - name: Restore
        run: dotnet restore Nnue.sln

      - name: Build
        run: dotnet build Nnue.sln -c Release --no-restore -p:Version="$PACKAGE_VERSION"

      - name: Test
        run: dotnet test Nnue.Tests/Nnue.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Nnue/Nnue.csproj -c Release --no-build -p:Version="$PACKAGE_VERSION" -o artifacts

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*

      # Request the temporary key right before the push: it expires after one hour and every OIDC token can be exchanged only once.
      - name: Log in to nuget.org (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}     # nuget.org profile name (not the e-mail address)

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        # pushes the matching .snupkg to the symbol server as well
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
